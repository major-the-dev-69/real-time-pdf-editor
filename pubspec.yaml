name: sai_associates
description: "PBD Group Real Estate Application"

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  get: ^4.7.3
  # firebase_core: ^4.12.1
  # firebase_messaging: ^16.4.3
  # flutter_local_notifications: ^22.1.0
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  device_info_plus: ^13.2.0
  flutter_image_compress: ^2.5.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  encrypt_shared_preferences: ^1.0.1
  iconsax_flutter: ^1.0.1
  pinput: ^5.0.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.10.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/Lato-BlackItalic.ttf
          weight: 900
          style: italic
